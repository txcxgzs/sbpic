<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>烧饼图床 · sbimg</title>
<style>
/* ===== @property 动画变量 ===== */
@property --angle{syntax:"<angle>";inherits:false;initial-value:0deg}
@property --grad-pos{syntax:"<percentage>";inherits:false;initial-value:0%}
@property --shine-x{syntax:"<percentage>";inherits:false;initial-value:-120%}

:root{
  --bg:#f5f5f7; --card:#ffffff; --card-2:#f5f5f7; --card-3:#efeff1;
  --border:#eaeaec; --border-2:#e0e0e3;
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#a1a1a6; --text-4:#c7c7cc;
  --accent:#0071e3; --accent-2:#00a2ff; --accent-soft:#e8f1ff; --accent-soft-2:#d1e4ff;
  --ok:#34c759; --ok-bg:#e8f9ed; --warn:#ff9f0a; --warn-bg:#fff5e6; --bad:#ff3b30; --bad-bg:#ffeee9;
  --purple:#af52de; --purple-bg:#f5ecfe; --pink:#ff2d92; --pink-bg:#ffe9f4; --teal:#30b0c7; --teal-bg:#e3f6fa; --indigo:#5856d6; --indigo-bg:#ece9fe;
  --radius:18px; --radius-sm:12px; --radius-xs:8px;
  --shadow-sm:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.03);
  --shadow:0 2px 8px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --shadow-lg:0 24px 60px rgba(0,0,0,.16),0 8px 24px rgba(0,0,0,.08);
  --spring:cubic-bezier(.22,1,.36,1);
  --spring-soft:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-size:14px;line-height:1.5;letter-spacing:-.01em}
a{color:var(--accent);text-decoration:none}
::selection{background:var(--accent-soft-2)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d1d1d6;border-radius:10px;border:3px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#b0b0b5}

/* ===== 布局 ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:248px;background:rgba(255,255,255,.8);border-right:1px solid var(--border);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:20;transition:transform .3s var(--spring)}
.sidebar .logo{padding:26px 22px 20px;display:flex;align-items:center;gap:13px}
.sidebar .logo .mark{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#0071e3,#00a2ff);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:-1px;box-shadow:0 4px 12px rgba(0,113,227,.32);animation:logo-breathe 4s ease-in-out infinite alternate}
@keyframes logo-breathe{from{box-shadow:0 4px 12px rgba(0,113,227,.32)}to{box-shadow:0 4px 20px rgba(0,113,227,.5)}}
.sidebar .logo .txt{font-size:16px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.sidebar .logo .txt span{display:block;font-size:10px;color:var(--text-3);font-weight:600;letter-spacing:2px;margin-top:2px}
.nav{flex:1;padding:4px 14px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;position:relative}
.nav-section{font-size:10px;font-weight:700;color:var(--text-4);letter-spacing:1px;text-transform:uppercase;padding:18px 14px 8px}
.nav-item{position:relative;display:flex;align-items:center;gap:13px;padding:10px 14px;border-radius:var(--radius-sm);color:var(--text-2);cursor:pointer;font-size:14px;font-weight:500;transition:.18s var(--spring);border:none;background:none;width:100%;text-align:left;font-family:inherit;z-index:1}
.nav-item:hover{background:rgba(0,0,0,.045);color:var(--text)}
.nav-item:hover .ico{scale:1.15;rotate:-4deg}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item.active::before{content:'';position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--accent);border-radius:0 3px 3px 0;animation:nav-bar-in .3s var(--spring)}
@keyframes nav-bar-in{from{height:0;opacity:0}to{height:18px;opacity:1}}
.nav-item .ico{width:22px;text-align:center;flex-shrink:0;font-size:16px;opacity:.7;transition:scale .25s var(--spring-soft),rotate .25s var(--spring-soft)}
.nav-item.active .ico{opacity:1;scale:1.1}
.sidebar .foot{padding:16px 22px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3);letter-spacing:.2px}
.main{flex:1;margin-left:248px;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:64px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 40px;position:sticky;top:0;background:rgba(245,245,247,.78);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);z-index:10}
.topbar .crumb{font-size:18px;font-weight:600;letter-spacing:-.02em;animation:fade-in .3s ease}
.topbar .crumb .sub{color:var(--text-3);font-weight:400;margin-left:8px;font-size:13px}
.topbar .user-chip{display:flex;align-items:center;gap:11px;font-size:13px;cursor:pointer;padding:5px 8px 5px 12px;border-radius:30px;transition:.15s}
.topbar .user-chip:hover{background:rgba(0,0,0,.04)}
.topbar .user-chip .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#0071e3,#00a2ff);border:none;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;flex-shrink:0;transition:scale .2s var(--spring-soft)}
.topbar .user-chip:hover .avatar{scale:1.08}
.topbar .user-chip .info{display:flex;flex-direction:column;line-height:1.3;text-align:right}
.topbar .user-chip .info .name{font-weight:600;font-size:13px;color:var(--text)}
.topbar .user-chip .info .role{font-size:11px;color:var(--text-3)}
.content{padding:36px 40px 48px;flex:1;max-width:1240px;width:100%;animation:view-in .4s var(--spring)}
@keyframes view-in{from{opacity:0;translate:0 12px}to{opacity:1;translate:0 0}}

/* ===== 通用 ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:26px;margin-bottom:20px;box-shadow:var(--shadow-sm);transition:box-shadow .3s,translate .3s var(--spring)}
.card:hover{box-shadow:var(--shadow)}
.card-title{font-size:15px;font-weight:600;color:var(--text);margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;letter-spacing:-.02em}
.card-title .sub{font-size:12px;color:var(--text-3);font-weight:400;display:flex;align-items:center;gap:8px}
.btn{position:relative;overflow:hidden;padding:10px 20px;border:none;border-radius:100px;background:var(--card-3);color:var(--text);font-size:13.5px;font-weight:500;cursor:pointer;transition:translate .18s var(--spring-soft),scale .18s var(--spring-soft),background .18s,box-shadow .3s;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;white-space:nowrap}
.btn:hover{background:var(--border-2)}
.btn:active{scale:.96}
.btn::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(var(--shine-x));pointer-events:none}
.btn:hover::before{animation:shine .6s ease}
@keyframes shine{from{--shine-x:-120%}to{--shine-x:120%}}
.btn-primary{background:linear-gradient(135deg,#0071e3,#0089ff);color:#fff;box-shadow:0 2px 8px rgba(0,113,227,.3)}
.btn-primary:hover{box-shadow:0 8px 24px -4px rgba(0,113,227,.5);filter:brightness(1.05);background:linear-gradient(135deg,#0071e3,#0089ff)}
.btn-primary::before{background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%)}
.btn-danger{background:var(--bad-bg);color:var(--bad)}
.btn-danger:hover{background:#ffd9d4;color:var(--bad)}
.btn-sm{padding:7px 16px;font-size:12.5px}
.btn-ghost{background:transparent;color:var(--text-2)}
.btn-ghost:hover{background:rgba(0,0,0,.05);color:var(--text)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;color:var(--text-2);margin-bottom:8px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:12px 15px;background:var(--card-2);border:1.5px solid transparent;border-radius:var(--radius-sm);color:var(--text);font-size:14px;font-family:inherit;transition:.15s}
.field input::placeholder,.field textarea::placeholder{color:var(--text-4)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);background:var(--card);box-shadow:0 0 0 4px var(--accent-soft)}
.field select{background:var(--card-2);cursor:pointer}
.field .hint{font-size:11.5px;color:var(--text-3);margin-top:7px;line-height:1.4}
.badge{font-size:11px;padding:3px 11px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:3px;line-height:1.5}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-bad{background:var(--bad-bg);color:var(--bad)}
.badge-admin{background:var(--purple-bg);color:var(--purple)}
.badge-user{background:rgba(0,0,0,.05);color:var(--text-2)}
.filter-select{padding:7px 14px;border:1.5px solid var(--border-2);border-radius:100px;font-size:12.5px;background:var(--card);font-family:inherit;cursor:pointer;transition:.15s;color:var(--text-2);font-weight:500}
.filter-select:hover{border-color:var(--accent);color:var(--accent)}
.filter-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* ===== 骨架屏 shimmer ===== */
.skeleton{background:var(--card-2);position:relative;overflow:hidden;border-radius:6px}
.skeleton::after{content:'';position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shimmer 1.5s linear infinite}
@keyframes shimmer{to{transform:translateX(100%)}}
.skeleton-line{height:14px;margin-bottom:8px}
.skeleton-line:last-child{margin-bottom:0;width:60%}
.stat-skeleton .sk-num{height:32px;width:80px;margin-bottom:8px}
.stat-skeleton .sk-label{height:12px;width:60px;margin-bottom:12px}

/* ===== 欢迎区 — 动态极光渐变 ===== */
.hero{border-radius:var(--radius);padding:32px 34px;margin-bottom:22px;color:#fff;position:relative;overflow:hidden;isolation:isolate;box-shadow:0 8px 32px rgba(0,113,227,.25);animation:fade-in .5s ease}
.hero::before{content:'';position:absolute;inset:-50%;background:conic-gradient(from var(--angle),#0071e3,#00a2ff,#5e5ce6,#af52de,#0071e3);filter:blur(60px);opacity:.6;animation:spin-aurora 10s linear infinite;z-index:-2}
.hero::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(0,113,227,.92),rgba(0,162,255,.85) 50%,rgba(94,92,230,.7));z-index:-1}
@keyframes spin-aurora{to{--angle:360deg}}
.hero .greet{font-size:13px;opacity:.9;margin-bottom:6px;font-weight:500;animation:fade-in-up .5s .05s both}
.hero .name{font-size:26px;font-weight:700;letter-spacing:-.03em;position:relative;z-index:1;animation:fade-in-up .5s .1s both}
.hero .name span{font-weight:400;opacity:.8}
.hero .desc{font-size:13px;opacity:.8;margin-top:10px;position:relative;z-index:1;animation:fade-in-up .5s .15s both}
@keyframes fade-in-up{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}
@keyframes fade-in{from{opacity:0}to{opacity:1}}

/* ===== 统计卡 — 交错入场 + 悬浮 ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 24px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;opacity:0;animation:card-in .5s var(--spring) forwards;transition:translate .3s var(--spring),box-shadow .3s,rotate .3s var(--spring)}
.stat:hover{translate:0 -4px;box-shadow:var(--shadow)}
.stat:nth-child(1){animation-delay:.05s}
.stat:nth-child(2){animation-delay:.12s}
.stat:nth-child(3){animation-delay:.19s}
.stat:nth-child(4){animation-delay:.26s}
.stat:nth-child(5){animation-delay:.33s}
.stat:nth-child(6){animation-delay:.4s}
@keyframes card-in{from{opacity:0;translate:0 24px;scale:.96}to{opacity:1;translate:0 0;scale:1}}
.stat .label{font-size:12px;color:var(--text-3);margin-bottom:12px;font-weight:600;display:flex;align-items:center;gap:7px}
.stat .label .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;animation:pulse-dot 2.5s ease-in-out infinite}
@keyframes pulse-dot{0%,100%{opacity:1;scale:1}50%{opacity:.5;scale:.8}}
.stat .num{font-size:32px;font-weight:700;letter-spacing:-.03em;color:var(--text);line-height:1.1;font-variant-numeric:tabular-nums}
.stat .num.counting{animation:count-glow .8s ease}
@keyframes count-glow{0%{text-shadow:0 0 20px rgba(0,113,227,.5)}100%{text-shadow:none}}
.stat .sub{font-size:11px;color:var(--text-3);margin-top:6px}

/* ===== 表格 — 行逐条入场 + 扫光悬停 ===== */
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{padding:12px 16px;text-align:left;font-weight:600;color:var(--text-3);font-size:11px;letter-spacing:.4px;border-bottom:1.5px solid var(--border);background:transparent;white-space:nowrap;text-transform:uppercase}
td{padding:15px 16px;border-bottom:1px solid var(--border);color:var(--text);transition:background .15s}
tbody tr{position:relative;animation:row-in .4s var(--spring) both}
tbody tr:nth-child(1){animation-delay:.02s}
tbody tr:nth-child(2){animation-delay:.05s}
tbody tr:nth-child(3){animation-delay:.08s}
tbody tr:nth-child(4){animation-delay:.11s}
tbody tr:nth-child(5){animation-delay:.14s}
tbody tr:nth-child(6){animation-delay:.17s}
tbody tr:nth-child(7){animation-delay:.2s}
tbody tr:nth-child(8){animation-delay:.23s}
@keyframes row-in{from{opacity:0;translate:-12px 0}to{opacity:1;translate:0 0}}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:var(--card-2)}
tbody tr::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(0,113,227,.06),transparent);transform:translateX(-100%);pointer-events:none;transition:transform .6s var(--spring)}
tbody tr:hover::after{transform:translateX(100%)}
.mono{font-family:"SF Mono","JetBrains Mono","Cascadia Code",Consolas,monospace;font-size:12px;color:var(--text-2)}
.muted{color:var(--text-3)}
.thumb{width:46px;height:46px;border-radius:var(--radius-xs);object-fit:cover;background:var(--card-2);border:none;transition:scale .2s var(--spring-soft)}
tr:hover .thumb{scale:1.1}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:20px;flex-wrap:wrap}
.pager button{min-width:38px;height:38px}
.empty{text-align:center;padding:56px 20px;color:var(--text-3);font-size:14px;animation:fade-in .4s ease}
.empty .ico{font-size:40px;opacity:.25;margin-bottom:14px;display:block;animation:empty-float 3s ease-in-out infinite alternate}
@keyframes empty-float{from{translate:0 0}to{translate:0 -6px}}

/* ===== 上传区 ===== */
.drop{border:2px dashed var(--border-2);border-radius:var(--radius);padding:56px 24px;text-align:center;cursor:pointer;transition:.2s var(--spring);background:var(--card-2);position:relative;overflow:hidden}
.drop:hover{border-color:var(--accent);background:var(--accent-soft);translate:0 -2px}
.drop.drag{border-color:var(--accent);background:var(--accent-soft);scale:1.005;border-style:solid}
.drop.drag::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(0,113,227,.15) 0 12px,transparent 12px 24px);background-size:200% 100%;animation:march .5s linear infinite;pointer-events:none}
@keyframes march{to{background-position:24px 0}}
.drop .big-ico{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--accent-soft),var(--accent-soft-2));display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 18px;color:var(--accent);transition:.3s var(--spring-soft);animation:bounce-idle 3s ease-in-out infinite}
@keyframes bounce-idle{0%,100%{translate:0 0}50%{translate:0 -6px}}
.drop:hover .big-ico{scale:1.1;rotate:-5deg;box-shadow:0 8px 24px rgba(0,113,227,.25)}
.drop .t1{font-size:16px;color:var(--text);margin-bottom:6px;font-weight:600}
.drop .t2{font-size:13px;color:var(--text-3)}
.drop.disabled{opacity:.5;cursor:not-allowed}
.drop.disabled .big-ico{animation:none}
.upload-results{margin-top:20px;display:flex;flex-direction:column;gap:12px}
.upload-item{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;box-shadow:var(--shadow-sm);animation:slideUp .35s var(--spring)}
.upload-item img{width:58px;height:58px;border-radius:var(--radius-xs);object-fit:cover;background:var(--card-2);flex-shrink:0;border:none}
.upload-item .meta{flex:1;min-width:0}
.upload-item .name{font-size:13.5px;word-break:break-all;font-weight:500}
.upload-item .links{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{font-size:11.5px;padding:5px 12px;border-radius:20px;background:var(--card-3);border:none;color:var(--text-2);cursor:pointer;user-select:none;transition:.15s;font-weight:500}
.chip:hover{background:var(--accent-soft);color:var(--accent)}
.chip-url{background:var(--accent-soft);color:var(--accent)}
.tag-dedup{font-size:10px;padding:3px 9px;border-radius:6px;background:var(--warn-bg);color:var(--warn);margin-left:6px;font-weight:600}

/* ===== 信息行（只读展示） ===== */
.info-row{display:flex;align-items:center;justify-content:space-between;padding:17px 0;border-bottom:1px solid var(--border);gap:16px;transition:background .15s}
.info-row:hover{background:var(--card-2);border-radius:8px}
.info-row:last-child{border-bottom:none;padding-bottom:0}
.info-row:first-child{padding-top:0}
.info-row .left{display:flex;flex-direction:column;gap:4px;min-width:0}
.info-row .label{font-size:12px;color:var(--text-3);font-weight:500}
.info-row .value{font-size:14.5px;color:var(--text);font-weight:500;word-break:break-all}
.info-row .value .muted{color:var(--text-3);font-weight:400}
.info-row .right{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* ===== Banner ===== */
.banner{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--radius-sm);margin-bottom:20px;font-size:13.5px;border:none;line-height:1.5;animation:fade-in .4s ease}
.banner-warn{background:var(--warn-bg);color:var(--warn)}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:90px}
.modal-overlay.show{display:flex;animation:fadeIn .25s ease}
.modal{background:var(--card);border:none;border-radius:var(--radius);width:480px;max-width:92vw;box-shadow:var(--shadow-lg);animation:modalIn .4s var(--spring-soft);overflow:hidden}
@keyframes modalIn{from{opacity:0;scale:.92;translate:0 16px}to{opacity:1;scale:1;translate:0 0}}
.modal-head{padding:22px 26px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head .title{font-size:17px;font-weight:600;letter-spacing:-.02em}
.modal-head .close{cursor:pointer;color:var(--text-3);font-size:20px;background:var(--card-3);border:none;border-radius:50%;width:32px;height:32px;display:flex;align-items:center;justify-content:center;line-height:1;transition:rotate .25s var(--spring-soft),background .15s,color .15s}
.modal-head .close:hover{background:var(--border-2);color:var(--text);rotate:90deg}
.modal-body{padding:26px}
.modal-body .field:last-child{margin-bottom:0}
.modal-foot{padding:18px 26px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;background:var(--card-2)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ===== Toast — 倒计时进度条 ===== */
.toast{position:fixed;bottom:36px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(29,29,31,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;padding:13px 24px 16px;border-radius:30px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;transition:transform .35s var(--spring-soft),opacity .3s;pointer-events:none;z-index:200;overflow:hidden}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{background:rgba(52,199,89,.94)}
.toast.bad{background:rgba(255,59,48,.94)}
.toast::after{content:'';position:absolute;left:0;bottom:0;height:3px;width:100%;background:rgba(255,255,255,.5);transform-origin:left;transform:scaleX(0)}
.toast.show::after{animation:toast-shrink 2s linear forwards}
@keyframes toast-shrink{from{transform:scaleX(1)}to{transform:scaleX(0)}}

/* ===== Auth 页 — 动态光晕 ===== */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.auth-wrap::before{content:'';position:absolute;top:-20%;left:-10%;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,113,227,.12),transparent 65%);pointer-events:none;animation:float-orb 12s ease-in-out infinite alternate}
.auth-wrap::after{content:'';position:absolute;bottom:-20%;right:-10%;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,rgba(175,82,222,.1),transparent 65%);pointer-events:none;animation:float-orb 15s ease-in-out infinite alternate-reverse}
@keyframes float-orb{from{translate:0 0}to{translate:30px 40px}}
.auth-card{width:420px;max-width:92vw;background:rgba(255,255,255,.85);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%);border:1px solid rgba(255,255,255,.6);border-radius:24px;box-shadow:var(--shadow-lg);overflow:hidden;position:relative;z-index:1;animation:auth-card-in .6s var(--spring-soft)}
@keyframes auth-card-in{from{opacity:0;translate:0 30px;scale:.96}to{opacity:1;translate:0 0;scale:1}}
.auth-head{text-align:center;padding:48px 28px 28px}
.auth-head .mark{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,#0071e3,#00a2ff);margin:0 auto 20px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:700;color:#fff;letter-spacing:-1px;box-shadow:0 8px 24px rgba(0,113,227,.35);animation:mark-float 4s ease-in-out infinite alternate}
@keyframes mark-float{from{translate:0 0;box-shadow:0 8px 24px rgba(0,113,227,.35)}to{translate:0 -8px;box-shadow:0 16px 32px rgba(0,113,227,.45)}}
.auth-head h1{font-size:24px;margin-bottom:6px;letter-spacing:-.03em;font-weight:700}
.auth-head p{font-size:13.5px;color:var(--text-3)}
.auth-tabs{display:flex;border-bottom:1px solid var(--border);padding:0 28px}
.auth-tab{flex:1;padding:14px;text-align:center;font-size:14px;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;transition:.18s var(--spring);background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;font-weight:500}
.auth-tab:hover{color:var(--text-2)}
.auth-tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.auth-body{padding:28px 32px 36px}
.auth-body .field{animation:fade-in-up .4s var(--spring) both}
.auth-body .field:nth-child(1){animation-delay:.05s}
.auth-body .field:nth-child(2){animation-delay:.1s}
.auth-body .field:nth-child(3){animation-delay:.15s}
.auth-body .field:last-of-type{margin-bottom:18px}
.auth-msg{color:var(--bad);font-size:12.5px;min-height:16px;margin-bottom:10px;font-weight:500}
.turnstile-wrap{margin:4px 0 14px;min-height:65px}

/* ===== View Transitions (页面切换动画) ===== */
::view-transition-old(root){animation:vt-out .25s ease both}
::view-transition-new(root){animation:vt-in .35s var(--spring) both}
@keyframes vt-out{to{opacity:0;translate:0 -8px}}
@keyframes vt-in{from{opacity:0;translate:0 16px}to{opacity:1;translate:0 0}}

/* ===== 响应式 ===== */
@media(max-width:860px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .main{margin-left:0}
  .content{padding:24px 20px}
  .topbar{padding:0 20px}
  .hero{padding:24px}
  .hero .name{font-size:22px}
  .menu-toggle{display:block!important}
}
.menu-toggle{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;margin-right:14px;padding:4px;border-radius:8px;transition:.15s}
.menu-toggle:hover{background:rgba(0,0,0,.05)}
.hidden{display:none!important}

/* ===== 无障碍：减弱动效 ===== */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>

<!-- ===== Auth 页 ===== -->
<div class="auth-wrap" id="authView">
  <div class="auth-card">
    <div class="auth-head">
      <div class="mark">饼</div>
      <h1>烧饼图床</h1>
      <p>自托管 · Cloudflare R2</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin">登录</button>
      <button class="auth-tab" id="tabRegister">注册</button>
    </div>
    <div class="auth-body">
      <div id="loginBox">
        <div class="field"><label>用户名</label><input id="loginUser" type="text" autocomplete="username" /></div>
        <div class="field"><label>密码</label><input id="loginPass" type="password" autocomplete="current-password" /></div>
        <div class="auth-msg" id="loginMsg"></div>
        <button class="btn btn-primary" id="btnLogin" style="width:100%;padding:12px;font-size:14px">登录</button>
      </div>
      <div id="registerBox" class="hidden">
        <div class="field"><label>用户名</label><input id="regUser" type="text" placeholder="3-32 位字母数字下划线" /></div>
        <div class="field"><label>邮箱</label><input id="regEmail" type="email" placeholder="用于验证激活" /></div>
        <div class="field"><label>密码</label><input id="regPass" type="password" placeholder="至少 8 位" /></div>
        <div class="turnstile-wrap" id="turnstileWrap"></div>
        <div class="auth-msg" id="regMsg"></div>
        <button class="btn btn-primary" id="btnRegister" style="width:100%;padding:12px;font-size:14px">注册</button>
        <p style="font-size:11.5px;color:var(--text-3);margin-top:16px;text-align:center">注册后需点击邮件链接激活邮箱才能上传</p>
      </div>
    </div>
  </div>
</div>

<!-- ===== 主应用 ===== -->
<div class="app hidden" id="appView">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="mark">饼</div>
      <div class="txt">烧饼图床<span>SBIMG</span></div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="foot">v1.0 · R2 Storage</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="crumb" id="crumb">仪表盘</div>
      </div>
      <div class="user-chip" id="userChip">
        <div class="info"><span class="name" id="chipName"></span><span class="role" id="chipRole"></span></div>
        <div class="avatar" id="chipAvatar"></div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- ===== Modal ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-head"><span class="title" id="modalTitle"></span><button class="close" id="modalClose">×</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let me = null, turnstileToken = null, tsWidgetId = null, turnstileEnabled = false;
let page = 1, pageSize = 30, total = 0;
let adminPage = 1, adminTotal = 0, adminFilter = 'all';
let curView = 'dashboard';

/* ===== 工具 ===== */
function toast(msg, type){ const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (type?' '+type:''); void t.offsetWidth; t.className = 'toast show' + (type?' '+type:''); clearTimeout(t._timer); t._timer = setTimeout(()=>{ t.className = t.className.replace(' show',''); }, 2000); }
async function copy(text){ try { await navigator.clipboard.writeText(text); toast('已复制','ok'); } catch { toast('复制失败','bad'); } }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(n){ if(n<1024)return n+' B'; if(n<1048576)return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(2)+' MB'; }
function fmtDate(d){ return new Date(d).toLocaleString('zh-CN',{hour12:false}); }
function maskToken(t){ if(!t||t.length<16) return t||'-'; return t.slice(0,8)+'••••••••'+t.slice(-4); }
function maskEmail(e){ if(!e) return '-'; const at=e.indexOf('@'); if(at<0) return e; const u=e.slice(0,at), d=e.slice(at); return (u.length>3?u.slice(0,3)+'•••':u)+d; }
async function api(path, opts){ const r = await fetch(path, opts); const t = await r.text(); let j; try{j=JSON.parse(t)}catch{j={raw:t}} if(!r.ok) throw new Error(j.error||j.raw||'HTTP '+r.status); return j; }

/* ===== 数字滚动动画 ===== */
function countUp(el, target, duration){
  duration = duration || 1200;
  const start = performance.now();
  el.classList.add('counting');
  function frame(now){
    const p = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = Math.floor(target * eased).toLocaleString();
    if(p < 1) requestAnimationFrame(frame);
    else { el.textContent = target.toLocaleString(); setTimeout(()=>el.classList.remove('counting'), 800); }
  }
  requestAnimationFrame(frame);
}
/* 给容器内所有 .num[data-count] 做滚动动画 */
function animateCounts(container){
  container.querySelectorAll('.num[data-count]').forEach(el => {
    const v = parseInt(el.dataset.count, 10);
    if(!isNaN(v) && v > 0) countUp(el, v);
  });
}

/* ===== Modal ===== */
function openModal(title, bodyHtml, footHtml){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHtml;
  $('#modalFoot').innerHTML = footHtml;
  $('#modalOverlay').classList.add('show');
}
function closeModal(){ $('#modalOverlay').classList.remove('show'); }
$('#modalClose').addEventListener('click', closeModal);
$('#modalOverlay').addEventListener('click', e => { if(e.target===$('#modalOverlay')) closeModal(); });
function confirmBox(title, msg, onOk, danger){
  openModal(title, `<p style="font-size:13.5px;color:var(--text-2);line-height:1.6">${msg}</p>`,
    `<button class="btn btn-ghost" data-act="cancel">取消</button><button class="btn ${danger?'btn-danger':'btn-primary'}" data-act="ok">${danger?'确认删除':'确认'}</button>`);
  $('#modalFoot [data-act=cancel]').addEventListener('click', closeModal);
  $('#modalFoot [data-act=ok]').addEventListener('click', () => { closeModal(); onOk(); });
}

/* ===== 鉴权 ===== */
async function loadMe(){ try{ me = await api('/api/auth/me'); return true; }catch{ return false; } }
async function logout(){ await api('/api/auth/logout',{method:'POST'}); me=null; $('#appView').classList.add('hidden'); $('#authView').classList.remove('hidden'); }

$('#tabLogin').addEventListener('click', () => switchAuthTab('login'));
$('#tabRegister').addEventListener('click', () => switchAuthTab('register'));
function switchAuthTab(t){
  $('#tabLogin').classList.toggle('active', t==='login');
  $('#tabRegister').classList.toggle('active', t==='register');
  $('#loginBox').classList.toggle('hidden', t!=='login');
  $('#registerBox').classList.toggle('hidden', t!=='register');
  $('#loginMsg').textContent=''; $('#regMsg').textContent='';
  if(t==='register') setupTurnstile();
}
$('#btnLogin').addEventListener('click', async () => {
  try{ me = await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#loginUser').value.trim(),password:$('#loginPass').value})}); enterApp(); }
  catch(e){ $('#loginMsg').textContent = e.message; }
});
$('#btnRegister').addEventListener('click', async () => {
  try{
    me = await api('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#regUser').value.trim(),email:$('#regEmail').value.trim(),password:$('#regPass').value,turnstileToken})});
    if(me.verification_sent) toast('注册成功，请查收邮件激活','ok');
    enterApp();
  }catch(e){ $('#regMsg').textContent = e.message; if(tsWidgetId!==null && window.turnstile) window.turnstile.reset(tsWidgetId); }
});

/* ===== Turnstile ===== */
async function setupTurnstile(){
  if(tsWidgetId!==null) return;
  try{
    const k = await api('/api/auth/turnstile-key');
    turnstileEnabled = k.enabled;
    if(!k.enabled){ $('#turnstileWrap').innerHTML = '<span style="font-size:11px;color:var(--text-3)">人机验证未启用</span>'; return; }
    const s = document.createElement('script');
    s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onTsLoad&render=explicit';
    s.async=true; s.defer=true;
    window.onTsLoad = () => { tsWidgetId = window.turnstile.render('#turnstileWrap',{sitekey:k.siteKey,callback:t=>{turnstileToken=t;}}); };
    document.body.appendChild(s);
  }catch{ $('#turnstileWrap').innerHTML='<span style="font-size:11px;color:var(--text-3)">人机验证加载失败</span>'; }
}

/* ===== 进入应用 ===== */
function enterApp(){
  $('#authView').classList.add('hidden');
  $('#appView').classList.remove('hidden');
  $('#chipName').textContent = me.username;
  $('#chipRole').textContent = me.role==='admin' ? '管理员' : '用户';
  $('#chipAvatar').textContent = me.username.charAt(0).toUpperCase();
  navTo('dashboard');
}

/* ===== 导航（按角色动态生成） ===== */
function navItems(){
  const items = [
    {id:'dashboard',label:'仪表盘',ico:'⊞'},
    {id:'upload',label:'上传图片',ico:'⬆'},
    {id:'images',label:'我的图片',ico:'▦'},
    {id:'account',label:'账户',ico:'⚙'},
  ];
  if(me && me.role==='admin') items.push({id:'admin',label:'管理后台',ico:'★'}, {id:'settings',label:'系统设置',ico:'☰'});
  return items;
}
function buildNav(){
  const nav = $('#navList'); nav.innerHTML='';
  const items = navItems();
  items.forEach(n => {
    const b = document.createElement('button');
    b.className='nav-item'+(n.id===curView?' active':'');
    b.innerHTML = `<span class="ico">${n.ico}</span>${n.label}`;
    b.addEventListener('click', () => navTo(n.id));
    nav.appendChild(b);
  });
}
function navTo(view){
  const doNav = () => {
    curView = view;
    buildNav();
    $('#sidebar').classList.remove('open');
    const labels = {dashboard:'仪表盘',upload:'上传图片',images:'我的图片',account:'账户',admin:'管理后台',settings:'系统设置'};
    $('#crumb').textContent = labels[view] || '';
    renderView(view);
  };
  // 支持且非同一页时用 View Transition 做页面切换动画
  if(document.startViewTransition && view !== curView){
    document.startViewTransition(doNav);
  } else {
    doNav();
  }
}
$('#menuToggle').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
$('#userChip').addEventListener('click', () => navTo('account'));

/* ===== 视图分发 ===== */
function renderView(view){
  const c = $('#content'); c.innerHTML = '';
  if(view==='dashboard') renderDashboard(c);
  else if(view==='upload') renderUpload(c);
  else if(view==='images') renderImages(c);
  else if(view==='account') renderAccount(c);
  else if(view==='admin') renderAdmin(c);
  else if(view==='settings') renderSettings(c);
}

/* ===== 仪表盘 ===== */
async function renderDashboard(c){
  const isAdmin = me.role==='admin';
  c.innerHTML = `
    ${!me.email_verified ? '<div class="banner banner-warn"><span>⚠️ 邮箱未验证，上传功能已禁用。请查收邮件完成验证。</span><button class="btn btn-sm" id="bResend" style="margin-left:auto;background:rgba(255,159,10,.15);color:var(--warn)">重发验证邮件</button></div>' : ''}
    <div class="hero">
      <div class="greet">${new Date().getHours()<12?'早上好':new Date().getHours()<18?'下午好':'晚上好'} 👋</div>
      <div class="name">${escapeHtml(me.username)}<span>，欢迎回来</span></div>
      <div class="desc">${isAdmin?'管理员视角 · 可查看全站数据':'上传你的图片，获取高速直链'}</div>
    </div>
    <div class="stats" id="statsBox"><div class="stat stat-skeleton"><div class="skeleton skeleton-line sk-label"></div><div class="skeleton skeleton-line sk-num"></div></div><div class="stat stat-skeleton"><div class="skeleton skeleton-line sk-label"></div><div class="skeleton skeleton-line sk-num"></div></div><div class="stat stat-skeleton"><div class="skeleton skeleton-line sk-label"></div><div class="skeleton skeleton-line sk-num"></div></div></div>
    <div class="card">
      <div class="card-title">最近上传<span class="sub">最新 5 张</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>预览</th><th>文件名</th><th>大小</th><th>时间</th></tr></thead><tbody id="recentBody"><tr><td colspan="4" class="empty">加载中…</td></tr></tbody></table></div>
    </div>`;
  if(!me.email_verified) $('#bResend').addEventListener('click', async () => { try{ await api('/api/auth/resend-verification',{method:'POST'}); toast('验证邮件已重发','ok'); }catch(e){ toast(e.message,'bad'); } });
  try{
    const data = await api('/api/images?page=1&size=5');
    const recent = data.items;
    let myCount = data.total, allCount = data.total;
    if(isAdmin){ try{ const all = await api('/api/images?page=1&size=1&all=1'); allCount = all.total; }catch{} }
    const dotImg = '#0071e3', dotAcc = '#34c759', dotRole = me.role==='admin'?'#af52de':'#8e8e93';
    $('#statsBox').innerHTML = `
      <div class="stat"><div class="label"><span class="dot" style="background:${dotImg}"></span>${isAdmin?'全站图片':'我的图片'}</div><div class="num" data-count="${isAdmin?allCount:myCount}">0</div>${isAdmin?`<div class="sub">我的 ${myCount} 张</div>`:''}</div>
      <div class="stat"><div class="label"><span class="dot" style="background:${dotAcc}"></span>账号状态</div><div class="num" style="font-size:16px;padding-top:8px">${me.email_verified?'<span class="badge badge-ok">已验证</span>':'<span class="badge badge-warn">待验证</span>'}</div></div>
      <div class="stat"><div class="label"><span class="dot" style="background:${dotRole}"></span>角色</div><div class="num" style="font-size:16px;padding-top:8px">${me.role==='admin'?'<span class="badge badge-admin">管理员</span>':'<span class="badge badge-user">用户</span>'}</div></div>`;
    animateCounts($('#statsBox'));
    if(!recent.length){ $('#recentBody').innerHTML = '<tr><td colspan="4" class="empty"><span class="ico">🖼️</span>暂无图片，去上传一张吧</td></tr>'; }
    else {
      $('#recentBody').innerHTML = recent.map(it => `<tr>
        <td><img class="thumb" src="${it.url}" loading="lazy"></td>
        <td><span class="mono">${escapeHtml(it.original_name||it.key)}</span></td>
        <td>${fmtSize(it.size)}</td>
        <td class="muted">${fmtDate(it.created_at)}</td></tr>`).join('');
    }
  }catch(e){ $('#statsBox').innerHTML = `<div class="stat"><div class="label">加载失败</div></div>`; }
}

/* ===== 上传 ===== */
function renderUpload(c){
  const canUpload = me.email_verified;
  c.innerHTML = `
    ${!canUpload ? '<div class="banner banner-warn">⚠️ 邮箱未验证，上传已禁用。<button class="btn btn-sm" id="upResend" style="margin-left:auto">重发验证邮件</button></div>' : ''}
    <div class="card">
      <div class="card-title">上传图片</div>
      <div class="drop ${canUpload?'':'disabled'}" id="drop">
        <div class="big-ico">⬆</div>
        <div class="t1">${canUpload?'拖拽图片到此处 · 点击选择 · Ctrl+V 粘贴':'邮箱未验证，上传已禁用'}</div>
        <div class="t2">支持 JPG / PNG / GIF / WebP / BMP</div>
        <input id="fileInput" type="file" accept="image/*" multiple hidden>
      </div>
      <div class="upload-results" id="results"></div>
    </div>`;
  if(!canUpload){ $('#upResend').addEventListener('click', async () => { try{ await api('/api/auth/resend-verification',{method:'POST'}); toast('验证邮件已重发','ok'); }catch(e){ toast(e.message,'bad'); } }); return; }
  const drop = $('#drop'), fileInput = $('#fileInput');
  drop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { if(fileInput.files.length) uploadFiles(fileInput.files); fileInput.value=''; });
  ['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', ev => { if(ev.dataTransfer.files.length) uploadFiles(ev.dataTransfer.files); });
  window.addEventListener('paste', onPaste);
}
function onPaste(ev){ if(curView!=='upload' || !me || !me.email_verified) return; const fs=[]; for(const it of ev.clipboardData.items){ if(it.kind==='file'){ const f=it.getAsFile(); if(f) fs.push(f); } } if(fs.length) uploadFiles(fs); }
function uploadFiles(files){ if(!me||!me.email_verified){ toast('请先验证邮箱','bad'); return; } Array.from(files).forEach(uploadOne); }
function uploadOne(file){
  const fd = new FormData(); fd.append('file', file);
  const card = document.createElement('div'); card.className='upload-item';
  card.innerHTML = `<img><div class="meta"><div class="name">上传中: ${escapeHtml(file.name)}</div><div class="links"><span class="chip">…</span></div></div>`;
  $('#results').prepend(card);
  card.querySelector('img').src = URL.createObjectURL(file);
  fetch('/upload',{method:'POST',headers:{'Authorization':'Bearer '+me.api_token},body:fd})
    .then(async r => { const text = await r.text(); if(!r.ok) throw new Error(text); return text; })
    .then(text => { let url, j; try{j=JSON.parse(text);url=j.url;}catch{url=text;j={url};}
      card.querySelector('.name').innerHTML = escapeHtml(file.name) + (j.duplicated?'<span class="tag-dedup">去重</span>':'');

async function renderImages(c){
  c.innerHTML = `<div class="card"><div class="card-title">我的图片<span class="sub" id="imgCount"></span></div>
    <div class="tbl-wrap"><table><thead><tr><th>预览</th><th>文件名 / Key</th><th>大小</th><th>尺寸</th><th>时间</th><th>操作</th></tr></thead><tbody id="tbody"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody></table></div>
    <div class="pager" id="pager"></div></div>`;
  await loadImages();
}
async function loadImages(){
  try{
    const data = await api(`/api/images?page=${page}&size=${pageSize}`);
    total = data.total;
    $('#imgCount').textContent = `共 ${total} 张`;
    const tb = $('#tbody');
    if(!data.items.length){ tb.innerHTML = '<tr><td colspan="6" class="empty"><span class="ico">🖼️</span>暂无图片，去上传一张吧</td></tr>'; renderPager(); return; }
    tb.innerHTML = data.items.map(it => `<tr>
      <td><img class="thumb" src="${it.url}" loading="lazy"></td>
      <td><span class="mono">${escapeHtml(it.original_name||it.key)}</span><br><span class="muted" style="font-size:11px">${escapeHtml(it.key)}</span></td>
      <td>${fmtSize(it.size)}</td>
      <td class="muted">${it.width&&it.height?it.width+'×'+it.height:'-'}</td>
      <td class="muted">${fmtDate(it.created_at)}</td>
      <td><button class="btn btn-sm btn-danger" data-del="${it.id}">删除</button></td></tr>`).join('');
    tb.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      confirmBox('删除图片','确认删除该图片？将同时删除 R2 中的对象，不可恢复。', async () => {
        try{ await api(`/api/images/${b.dataset.del}`,{method:'DELETE'}); toast('已删除','ok'); loadImages(); }catch(e){ toast(e.message,'bad'); }
      }, true);
    }));
    renderPager();
  }catch(e){ $('#tbody').innerHTML = `<tr><td colspan="6" class="empty">${escapeHtml(e.message)}</td></tr>`; }
}
function renderPager(){
  const pages = Math.max(1, Math.ceil(total/pageSize)); const box = $('#pager'); box.innerHTML='';
  if(pages<=1) return;
  const mk=(l,p,d)=>{ const b=document.createElement('button'); b.className='btn'; b.textContent=l; b.disabled=!!d; b.addEventListener('click',()=>{page=p;loadImages();}); return b; };
  box.appendChild(mk('‹',page-1,page<=1));
  const sp=document.createElement('span'); sp.style.cssText='font-size:13px;color:var(--text-2)'; sp.textContent=`${page} / ${pages}`; box.appendChild(sp);
  box.appendChild(mk('›',page+1,page>=pages));
}

async function loadSettingsData(){
  try{
    const j = await api('/api/admin/settings');
    settingsData = j.settings;
    // R2
    $('#sR2AccountId').innerHTML = valOrDash(settingsData.r2_account_id?.value);
    $('#sR2AccessKey').innerHTML = valOrDash(settingsData.r2_access_key_id?.value);
    $('#sR2SecretBadge').innerHTML = badgeConfigured(settingsData.r2_secret_access_key?.has_value);
    $('#sR2Bucket').innerHTML = valOrDash(settingsData.r2_bucket?.value);
    // 邮件
    $('#sMailEnabled').innerHTML = boolBadge(settingsData.mail_enabled?.value);
    $('#sSmtpHost').innerHTML = valOrDash(settingsData.smtp_host?.value);
    $('#sSmtpPort').textContent = settingsData.smtp_port?.value || '-';
    $('#sSmtpUser').innerHTML = valOrDash(settingsData.smtp_user?.value);
    $('#sSmtpPassBadge').innerHTML = badgeConfigured(settingsData.smtp_pass?.has_value);
    $('#sSmtpFrom').innerHTML = valOrDash(settingsData.smtp_from?.value);
    // Turnstile
    $('#sTurnstileEnabled').innerHTML = boolBadge(settingsData.turnstile_enabled?.value);
    $('#sTurnstileSiteKey').innerHTML = valOrDash(settingsData.turnstile_site_key?.value);
    $('#sTurnstileSecretBadge').innerHTML = badgeConfigured(settingsData.turnstile_secret_key?.has_value);
    // 站点与注册
    $('#sBaseUrl').innerHTML = valOrDash(settingsData.base_url?.value);
    $('#sAppUrl').innerHTML = valOrDash(settingsData.app_url?.value);
    $('#sAllowRegister').innerHTML = boolBadge(settingsData.allow_register?.value);
    $('#sRegisterLimit').textContent = settingsData.register_limit_per_10min?.value || '-';
    $('#sMaxSize').textContent = settingsData.max_size_mb?.value ? settingsData.max_size_mb.value + ' MB' : '-';
    // 限流
    $('#sGlobalLimit').textContent = settingsData.global_limit_per_min?.value || '-';
    $('#sUploadLimit').textContent = settingsData.upload_limit_per_min?.value || '-';
    $('#sUploadUserLimit').textContent = settingsData.upload_limit_per_user_per_min?.value || '-';
    $('#sViewLimit').textContent = settingsData.view_limit_per_min?.value || '-';
    $('#sLoginFailThreshold').textContent = settingsData.login_fail_threshold?.value || '-';
    $('#sLoginBanMinutes').textContent = settingsData.login_ban_minutes?.value || '-';
    $('#sUploadConcurrency').textContent = settingsData.upload_concurrency?.value || '-';
    // stats
    const r2ok = settingsData.r2_account_id?.value && settingsData.r2_access_key_id?.value && settingsData.r2_secret_access_key?.has_value;
    const mailok = settingsData.mail_enabled?.value === 'true' && settingsData.smtp_host?.value && settingsData.smtp_pass?.has_value;
    const tsok = settingsData.turnstile_enabled?.value === 'true' && settingsData.turnstile_site_key?.value;
    $('#settingsStats').innerHTML = `
      <div class="stat"><div class="label"><span class="dot" style="background:#0071e3"></span>R2 存储</div><div class="num" style="font-size:16px;padding-top:8px">${badgeConfigured(r2ok)}</div></div>
      <div class="stat"><div class="label"><span class="dot" style="background:#34c759"></span>邮件</div><div class="num" style="font-size:16px;padding-top:8px">${mailok?'<span class="badge badge-ok">已启用</span>':'<span class="badge badge-warn">未启用</span>'}</div></div>
      <div class="stat"><div class="label"><span class="dot" style="background:#af52de"></span>Turnstile</div><div class="num" style="font-size:16px;padding-top:8px">${tsok?'<span class="badge badge-ok">已启用</span>':'<span class="badge badge-warn">未启用</span>'}</div></div>`;
  }catch(e){ toast(e.message,'bad'); }
}
function boolSelect(id, val){ return `<select id="${id}"><option value="true" ${val==='true'?'selected':''}>启用</option><option value="false" ${val!=='true'?'selected':''}>禁用</option></select>`; }
function saveSettingsApi(obj){
  return api('/api/admin/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(obj)});
}
function modalEditR2(){
  const d = settingsData;
  openModal('编辑 Cloudflare R2',
    `<div class="field"><label>Account ID</label><input id="mR2AccountId" value="${escapeHtml(d.r2_account_id?.value||'')}" /></div>

     <div class="field"><label>Secret Access Key</label><input id="mR2Secret" type="password" placeholder="${d.r2_secret_access_key?.has_value?'留空保持不变':'填写 Secret Key'}" /></div>

    `<button class="btn btn-ghost" data-act="cancel">取消</button><button class="btn btn-primary" data-act="save">保存</button>`);

/* ===== 磁吸按钮 — 鼠标靠近时按钮轻微跟随 ===== */
function initMagneticButtons(){
  document.addEventListener('mousemove', e => {
    document.querySelectorAll('.btn-primary:not(:disabled)').forEach(btn => {
      const r = btn.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const dist = Math.hypot(e.clientX - cx, e.clientY - cy);
      if(dist < 80){
        const x = (e.clientX - cx) * 0.12;
        const y = (e.clientY - cy) * 0.12;
        btn.style.translate = `${x}px ${y}px`;
      } else {
        btn.style.translate = '';
      }
    });
  });
}

/* ===== 启动 ===== */
(async () => {
  if(await loadMe()) enterApp(); else { $('#authView').classList.remove('hidden'); $('#appView').classList.add('hidden'); }
  initMagneticButtons();
