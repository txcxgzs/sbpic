<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>烧饼图床</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif; background: #f5f6f8; color: #222; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 24px 16px 60px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  header h1 { font-size: 20px; margin: 0; }
  header .sub { color: #888; font-size: 13px; }
  .topbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .pill { font-size: 12px; padding: 3px 9px; border-radius: 20px; background: #eef1f4; color: #555; }
  .pill.admin { background: #fee9e9; color: #b91c1c; }
  .btn { padding: 8px 14px; border: none; border-radius: 6px; background: #2563eb; color: #fff; font-size: 13px; cursor: pointer; }
  .btn.ghost { background: #eef1f4; color: #333; }
  .btn.danger { background: #dc2626; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .card { background: #fff; border: 1px solid #e6e8eb; border-radius: 10px; padding: 16px; margin: 14px 0; }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 8px 0; }
  .row label { font-size: 13px; color: #555; min-width: 80px; }
  input[type="text"], input[type="password"], input[type="number"] { flex: 1; min-width: 160px; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
  textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; font-family: monospace; }
  .drop { border: 2px dashed #cfd3d8; border-radius: 10px; padding: 30px 16px; text-align: center; color: #888; cursor: pointer; transition: .15s; }
  .drop.drag { border-color: #2563eb; background: #eff6ff; color: #2563eb; }
  .results { margin-top: 16px; display: grid; gap: 12px; }
  .item { background: #fff; border: 1px solid #e6e8eb; border-radius: 10px; padding: 12px; display: flex; gap: 14px; align-items: center; }
  .item img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; background: #f0f0f0; flex-shrink: 0; }
  .item .meta { flex: 1; min-width: 0; }
  .item .name { font-size: 13px; word-break: break-all; }
  .item .links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .chip { font-size: 12px; padding: 3px 8px; border-radius: 5px; background: #eef1f4; color: #333; cursor: pointer; user-select: none; }
  .chip:hover { background: #e2e7ee; }
  .chip.url { background: #e7f0ff; color: #2563eb; }
  .tag { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: #fff3cd; color: #8a6d3b; margin-left: 6px; }
  table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; border: 1px solid #e6e8eb; }
  th, td { padding: 9px 10px; text-align: left; font-size: 13px; border-bottom: 1px solid #f0f1f3; }
  th { background: #fafbfc; color: #666; font-weight: 600; }
  td img { width: 44px; height: 44px; object-fit: cover; border-radius: 5px; }
  td .k { word-break: break-all; max-width: 220px; display: inline-block; }
  .del { color: #dc2626; cursor: pointer; }
  .pager { display: flex; gap: 8px; align-items: center; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #222; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13px; opacity: 0; transition: .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .empty { color: #999; text-align: center; padding: 20px; }
  .hidden { display: none !important; }
  a { color: #2563eb; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab { padding: 8px 14px; border: 1px solid #e6e8eb; border-radius: 6px 6px 0 0; background: #fafbfc; cursor: pointer; font-size: 13px; }
  .tab.active { background: #2563eb; color: #fff; border-color: #2563eb; }
  .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>烧饼图床 <span class="sub">/ sbimg · Cloudflare R2</span></h1></div>
    <div class="topbar" id="topbar"></div>
  </header>

  <!-- 登录/注册视图 -->
  <div id="authView" class="hidden">
    <div class="card" style="max-width:360px;margin:40px auto;">
      <div class="tabs">
        <div class="tab active" data-tab="login" id="tabLogin">登录</div>
        <div class="tab" data-tab="register" id="tabRegister">注册</div>
      </div>
      <div id="loginBox">
        <div class="row"><label>用户名</label><input id="loginUser" type="text" /></div>
        <div class="row"><label>密码</label><input id="loginPass" type="password" /></div>
        <div class="row" style="justify-content:flex-end;"><button class="btn" id="btnLogin">登录</button></div>
      </div>
      <div id="registerBox" class="hidden">
        <div class="row"><label>用户名</label><input id="regUser" type="text" placeholder="3-32位字母数字下划线" /></div>
        <div class="row"><label>密码</label><input id="regPass" type="password" placeholder="至少8位" /></div>
        <div class="row" style="justify-content:flex-end;"><button class="btn" id="btnRegister">注册</button></div>
      </div>
      <div id="authMsg" style="color:#dc2626;font-size:13px;margin-top:6px;"></div>
    </div>
  </div>

  <!-- 控制台视图 -->
  <div id="appView" class="hidden">
    <div class="card">
      <h2>上传图片</h2>
      <div class="drop" id="drop">
        <p>拖拽图片到此处 / 点击选择 / Ctrl+V 粘贴</p>
        <p class="sub" style="font-size:12px;">支持 jpg/png/gif/webp/bmp，单文件上限见服务端配置</p>
        <input id="fileInput" type="file" accept="image/*" multiple hidden />
      </div>
      <div class="results" id="results"></div>
    </div>

    <div class="card">
      <h2>我的图片</h2>
      <table>
        <thead><tr><th>预览</th><th>文件名 / Key</th><th>大小</th><th>尺寸</th><th>时间</th><th>操作</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="pager" id="pager"></div>
    </div>

    <div class="card">
      <h2>账户</h2>
      <div class="row"><label>API Token</label><input id="apiToken" type="text" readonly /> <button class="btn ghost" id="btnCopyToken">复制</button> <button class="btn ghost" id="btnRegenToken">重置</button></div>
      <p class="sub" style="font-size:12px;margin:0 0 10px;">上传 API 用此 Token（Header: <code>Authorization: Bearer &lt;token&gt;</code>）。重置后旧 Token 立即失效。</p>
      <div class="row"><label>旧密码</label><input id="oldPass" type="password" /></div>
      <div class="row"><label>新密码</label><input id="newPass" type="password" placeholder="至少8位" /></div>
      <div class="row" style="justify-content:flex-end;"><button class="btn" id="btnChangePass">修改密码</button></div>
    </div>

    <!-- 管理员视图 -->
    <div id="adminView" class="hidden">
      <div class="card">
        <h2>用户管理（管理员）</h2>
        <table>
          <thead><tr><th>ID</th><th>用户名</th><th>角色</th><th>图片数</th><th>创建时间</th><th>操作</th></tr></thead>
          <tbody id="userTbody"></tbody>
        </table>
        <h3 style="font-size:14px;margin:16px 0 8px;">新建用户</h3>
        <div class="row"><label>用户名</label><input id="newUser" type="text" /></div>
        <div class="row"><label>密码</label><input id="newUserPass" type="password" /></div>
        <div class="row"><label>角色</label>
          <select id="newUserRole"><option value="user">普通用户</option><option value="admin">管理员</option></select>
        </div>
        <div class="row" style="justify-content:flex-end;"><button class="btn" id="btnCreateUser">创建</button></div>
      </div>

      <div class="card">
        <h2>全部图片（管理员）</h2>
        <div class="row" style="margin-bottom:8px;">
          <label>筛选</label>
          <select id="adminFilter">
            <option value="all">全部</option>
            <option value="mine">仅自己</option>
            <option value="unowned">无主</option>
          </select>
          <button class="btn ghost" id="btnAdminRefresh">刷新</button>
        </div>
        <table>
          <thead><tr><th>预览</th><th>Key</th><th>归属</th><th>大小</th><th>时间</th><th>操作</th></tr></thead>
          <tbody id="adminTbody"></tbody>
        </table>
        <div class="pager" id="adminPager"></div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
let me = null;       // 当前用户
let page = 1, pageSize = 30, total = 0;
let adminPage = 1, adminTotal = 0, adminFilter = 'all';

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'), 1400); }
async function copy(text){ try { await navigator.clipboard.writeText(text); toast('已复制'); } catch { toast('复制失败'); } }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(n){ if(n<1024)return n+' B'; if(n<1048576)return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(2)+' MB'; }
function fmtDate(d){ return new Date(d).toLocaleString('zh-CN',{hour12:false}); }

async function api(path, opts){ const r = await fetch(path, opts); const t = await r.text(); let j; try { j = JSON.parse(t); } catch { j = { raw: t }; } if (!r.ok) throw new Error(j.error || j.raw || ('HTTP '+r.status)); return j; }

// ===== 鉴权 =====
async function loadMe(){
  try { me = await api('/api/auth/me'); return true; }
  catch { return false; }
}
function showAuth(){ $('#authView').classList.remove('hidden'); $('#appView').classList.add('hidden'); }
function showApp(){
  $('#authView').classList.add('hidden'); $('#appView').classList.remove('hidden');
  $('#topbar').innerHTML = `<span class="pill ${me.role==='admin'?'admin':''}">${escapeHtml(me.username)} · ${me.role==='admin'?'管理员':'用户'}</span><button class="btn ghost" id="btnLogout">登出</button>`;
  $('#btnLogout').addEventListener('click', logout);
  $('#apiToken').value = me.api_token;
  if (me.role === 'admin') { $('#adminView').classList.remove('hidden'); loadUsers(); loadAdminImages(); }
  else { $('#adminView').classList.add('hidden'); }
  loadImages();
}
async function logout(){ await api('/api/auth/logout',{method:'POST'}); me=null; showAuth(); }

// 登录/注册 tab
$('#tabLogin').addEventListener('click', () => switchTab('login'));
$('#tabRegister').addEventListener('click', () => switchTab('register'));
function switchTab(t){
  $('#tabLogin').classList.toggle('active', t==='login');
  $('#tabRegister').classList.toggle('active', t==='register');
  $('#loginBox').classList.toggle('hidden', t!=='login');
  $('#registerBox').classList.toggle('hidden', t!=='register');
  $('#authMsg').textContent='';
}
$('#btnLogin').addEventListener('click', async () => {
  try { me = await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#loginUser').value.trim(),password:$('#loginPass').value})}); showApp(); }
  catch(e){ $('#authMsg').textContent = e.message; }
});
$('#btnRegister').addEventListener('click', async () => {
  try { me = await api('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#regUser').value.trim(),password:$('#regPass').value})}); showApp(); }
  catch(e){ $('#authMsg').textContent = e.message; }
});

// ===== 上传 =====
const drop = $('#drop'), fileInput = $('#fileInput');
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => { if(fileInput.files.length) uploadFiles(fileInput.files); fileInput.value=''; });
['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('drag'); }));
['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('drag'); }));
drop.addEventListener('drop', ev => { if(ev.dataTransfer.files.length) uploadFiles(ev.dataTransfer.files); });
window.addEventListener('paste', ev => { const fs=[]; for(const it of ev.clipboardData.items){ if(it.kind==='file'){ const f=it.getAsFile(); if(f) fs.push(f); } } if(fs.length) uploadFiles(fs); });
function uploadFiles(files){ Array.from(files).forEach(uploadOne); }
function uploadOne(file){
  const fd = new FormData(); fd.append('file', file);
  const card = document.createElement('div'); card.className='item';
  card.innerHTML = `<img><div class="meta"><div class="name">上传中: ${escapeHtml(file.name)}</div><div class="links"><span class="chip">...</span></div></div>`;
  $('#results').prepend(card);
  card.querySelector('img').src = URL.createObjectURL(file);
  fetch('/upload', { method:'POST', headers:{'Authorization':'Bearer '+me.api_token}, body: fd })
    .then(async r => { const text = await r.text(); if(!r.ok) throw new Error(text); return text; })
    .then(text => { let url, j; try { j=JSON.parse(text); url=j.url; } catch { url=text; j={url}; }
      card.querySelector('.meta .name').innerHTML = escapeHtml(file.name) + (j.duplicated?'<span class="tag">去重</span>':'');
      const box = card.querySelector('.links'); box.innerHTML='';
      [['URL',j.url],['Markdown',j.markdown],['HTML',j.html],['BBCode',j.bbcode]].filter(([,v])=>v).forEach(([l,v])=>{ const c=document.createElement('span'); c.className='chip'+(l==='URL'?' url':''); c.textContent=l; c.addEventListener('click',()=>copy(v)); box.appendChild(c); });
      loadImages(); if(me.role==='admin' && adminFilter==='all') loadAdminImages();
    })
    .catch(err => { card.querySelector('.meta .name').textContent = '失败: '+(err.message||'未知错误'); card.style.opacity=.6; });
}

// ===== 我的图片 =====
async function loadImages(){
  try {
    const data = await api(`/api/images?page=${page}&size=${pageSize}`);
    total = data.total; renderTable(data.items, $('#tbody'), false); renderPager();
  } catch(e) { $('#tbody').innerHTML = `<tr><td colspan="6" class="empty">${escapeHtml(e.message)}</td></tr>`; }
}
function renderTable(items, tbody, isAdmin){
  tbody.innerHTML = '';
  if(!items.length){ tbody.innerHTML = `<tr><td colspan="${isAdmin?6:6}" class="empty">暂无图片</td></tr>`; return; }
  items.forEach(it => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td><img src="${it.url}" loading="lazy"></td>
      <td><span class="k" title="${escapeHtml(it.original_name||'')}">${escapeHtml(it.original_name||it.key)}</span>${isAdmin?'<br><span class="sub" style="font-size:11px;color:#999;">'+escapeHtml(it.key)+'</span>':''}</td>
      ${isAdmin?`<td>${it.user_id==null?'<span class="sub">无主</span>':'#'+it.user_id}</td>`:''}
      <td>${fmtSize(it.size)}</td>
      <td>${it.width&&it.height?it.width+'×'+it.height:'-'}</td>
      <td>${fmtDate(it.created_at)}</td>
      <td><span class="del" data-id="${it.id}">删除</span></td>`;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('.del').forEach(el => el.addEventListener('click', () => delImage(el.dataset.id, isAdmin)));
}
async function delImage(id, isAdmin){
  if(!confirm('确认删除？将同时删除 R2 中的对象。')) return;
  try { await api(`/api/images/${id}`,{method:'DELETE'}); toast('已删除'); if(isAdmin) loadAdminImages(); else loadImages(); }
  catch(e){ toast('删除失败: '+e.message); }
}
function renderPager(){
  const pages = Math.max(1, Math.ceil(total/pageSize)); const box = $('#pager'); box.innerHTML='';
  if(pages<=1) return;
  const mk=(l,p,d)=>{ const b=document.createElement('button'); b.className='btn'+(d?'':' ghost'); b.textContent=l; b.disabled=!!d; b.addEventListener('click',()=>{page=p;loadImages();}); return b; };
  box.appendChild(mk('上一页',page-1,page<=1));
  box.appendChild(Object.assign(document.createElement('span'),{textContent:`${page} / ${pages}`,style:'font-size:13px;'}));
  box.appendChild(mk('下一页',page+1,page>=pages));
}

// ===== 账户 =====
$('#btnCopyToken').addEventListener('click', () => copy(me.api_token));
$('#btnRegenToken').addEventListener('click', async () => {
  if(!confirm('重置后旧 API Token 立即失效，确认？')) return;
  try { const j = await api('/api/account/regenerate-token',{method:'POST'}); me.api_token = j.api_token; $('#apiToken').value = j.api_token; toast('已重置'); }
  catch(e){ toast(e.message); }
});
$('#btnChangePass').addEventListener('click', async () => {
  try { await api('/api/account/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({oldPassword:$('#oldPass').value,newPassword:$('#newPass').value})}); toast('密码已修改'); $('#oldPass').value=''; $('#newPass').value=''; }
  catch(e){ toast(e.message); }
});

// ===== 管理员 =====
async function loadUsers(){
  try { const j = await api('/api/admin/users'); renderUsers(j.items); }
  catch(e){ $('#userTbody').innerHTML = `<tr><td colspan="6" class="empty">${escapeHtml(e.message)}</td></tr>`; }
}
function renderUsers(items){
  const tb = $('#userTbody'); tb.innerHTML='';
  if(!items.length){ tb.innerHTML = '<tr><td colspan="6" class="empty">暂无用户</td></tr>'; return; }
  items.forEach(u => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${u.id}</td><td>${escapeHtml(u.username)} ${u.id===me.id?'<span class="sub">(你)</span>':''}</td>
      <td>${u.role==='admin'?'<span class="pill admin">管理员</span>':'用户'}</td>
      <td>${u.image_count}</td><td>${fmtDate(u.created_at)}</td>
      <td>
        <span class="del" data-act="del" data-id="${u.id}">删除</span>
        <span class="chip" data-act="reset" data-id="${u.id}">重置Token</span>
        <span class="chip" data-act="pwd" data-id="${u.id}">改密码</span>
      </td>`;
    tb.appendChild(tr);
  });
  tb.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', () => userAction(el.dataset.act, el.dataset.id)));
}
async function userAction(act, id){
  if(id==String(me.id) && act==='del'){ toast('不能删除自己'); return; }
  if(act==='del'){ if(!confirm('删除用户？其图片将转为无主，不连带删除。')) return; try { await api(`/api/admin/users/${id}`,{method:'DELETE'}); toast('已删除'); loadUsers(); } catch(e){ toast(e.message); } }
  else if(act==='reset'){ if(!confirm('重置该用户 API Token？')) return; try { await api(`/api/admin/users/${id}/reset-token`,{method:'POST'}); toast('已重置'); loadUsers(); } catch(e){ toast(e.message); } }
  else if(act==='pwd'){ const np = prompt('输入新密码（至少8位）'); if(!np) return; try { await api(`/api/admin/users/${id}/password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({newPassword:np})}); toast('已修改'); } catch(e){ toast(e.message); } }
}
$('#btnCreateUser').addEventListener('click', async () => {
  try { await api('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#newUser').value.trim(),password:$('#newUserPass').value,role:$('#newUserRole').value})}); toast('已创建'); $('#newUser').value=''; $('#newUserPass').value=''; loadUsers(); }
  catch(e){ toast(e.message); }
});

// 管理员图片
$('#adminFilter').addEventListener('change', e => { adminFilter = e.target.value; adminPage=1; loadAdminImages(); });
$('#btnAdminRefresh').addEventListener('click', loadAdminImages);
async function loadAdminImages(){
  let q = `page=${adminPage}&size=30&all=1`;
  if (adminFilter === 'mine') q = `page=${adminPage}&size=30`;
  else if (adminFilter === 'unowned') q = `page=${adminPage}&size=30&all=1&user_id=null`;
  try { const data = await api(`/api/images?${q}`); adminTotal = data.total; renderTable(data.items, $('#adminTbody'), true); renderAdminPager(); }
  catch(e){ $('#adminTbody').innerHTML = `<tr><td colspan="6" class="empty">${escapeHtml(e.message)}</td></tr>`; }
}
function renderAdminPager(){
  const pages = Math.max(1, Math.ceil(adminTotal/30)); const box = $('#adminPager'); box.innerHTML='';
  if(pages<=1) return;
  const mk=(l,p,d)=>{ const b=document.createElement('button'); b.className='btn'+(d?'':' ghost'); b.textContent=l; b.disabled=!!d; b.addEventListener('click',()=>{adminPage=p;loadAdminImages();}); return b; };
  box.appendChild(mk('上一页',adminPage-1,adminPage<=1));
  box.appendChild(Object.assign(document.createElement('span'),{textContent:`${adminPage} / ${pages}`,style:'font-size:13px;'}));
  box.appendChild(mk('下一页',adminPage+1,adminPage>=pages));
}

// 启动
(async () => { if (await loadMe()) showApp(); else showAuth(); })();
</script>
</body>
</html>
