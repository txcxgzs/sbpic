<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>烧饼图床 · sbimg</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --card-2:#f4f5f7;
  --border:#e9ebef; --border-2:#dde0e6;
  --text:#1a1d23; --text-2:#5b6472; --text-3:#9aa1ac;
  --accent:#2f5bd6; --accent-soft:#eef2ff; --accent-soft-2:#e0e7ff;
  --ok:#15a05a; --ok-bg:#ecfaf2; --warn:#b8862a; --warn-bg:#fbf4e6; --bad:#d12c3f; --bad-bg:#fceef0;
  --radius:10px; --radius-sm:7px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.04),0 1px 3px rgba(16,24,40,.06);
  --shadow:0 4px 16px rgba(16,24,40,.08);
  --shadow-lg:0 12px 40px rgba(16,24,40,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
a{color:var(--accent);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#d4d8df;border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#b8bdc6}

/* ===== 布局 ===== */
.app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:20;transition:transform .25s ease}
.sidebar .logo{padding:22px 20px 16px;display:flex;align-items:center;gap:11px}
.sidebar .logo .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:#fff;flex-shrink:0;letter-spacing:-1px}
.sidebar .logo .txt{font-size:15px;font-weight:600;letter-spacing:-.2px}
.sidebar .logo .txt span{display:block;font-size:10px;color:var(--text-3);font-weight:500;letter-spacing:1.5px;margin-top:1px}
.nav{flex:1;padding:8px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-section{font-size:10px;font-weight:600;color:var(--text-3);letter-spacing:.8px;text-transform:uppercase;padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--radius-sm);color:var(--text-2);cursor:pointer;font-size:13.5px;font-weight:500;transition:.12s;border:none;background:none;width:100%;text-align:left;font-family:inherit}
.nav-item:hover{background:var(--card-2);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--accent)}
.nav-item .ico{width:18px;text-align:center;flex-shrink:0;font-size:15px;opacity:.8}
.nav-item.active .ico{opacity:1}
.sidebar .foot{padding:14px 20px;border-top:1px solid var(--border);font-size:11px;color:var(--text-3)}
.main{flex:1;margin-left:230px;min-width:0;display:flex;flex-direction:column;min-height:100vh}
.topbar{height:58px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;background:rgba(246,247,249,.82);backdrop-filter:blur(10px);z-index:10}
.topbar .crumb{font-size:16px;font-weight:600;letter-spacing:-.2px}
.topbar .crumb .sub{color:var(--text-3);font-weight:400;margin-left:8px;font-size:13px}
.topbar .user-chip{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer}
.topbar .user-chip .avatar{width:30px;height:30px;border-radius:50%;background:var(--card-2);border:1px solid var(--border-2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text-2)}
.topbar .user-chip .info{display:flex;flex-direction:column;line-height:1.3;text-align:right}
.topbar .user-chip .info .name{font-weight:600;font-size:13px;color:var(--text)}
.topbar .user-chip .info .role{font-size:11px;color:var(--text-3)}
.content{padding:30px 32px;flex:1;max-width:1180px;width:100%}

/* ===== 通用 ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px;margin-bottom:20px;box-shadow:var(--shadow-sm)}
.card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;letter-spacing:-.1px}
.card-title .sub{font-size:12px;color:var(--text-3);font-weight:400}
.btn{padding:8px 15px;border:1px solid var(--border-2);border-radius:var(--radius-sm);background:var(--card);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:.12s;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit;white-space:nowrap}
.btn:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.btn-primary{background:var(--accent);border:1px solid var(--accent);color:#fff}
.btn-primary:hover{background:#2952c2;border-color:#2952c2;color:#fff}
.btn-danger{border-color:#e8c5c9;color:var(--bad);background:var(--card)}
.btn-danger:hover{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn-sm{padding:5px 11px;font-size:12px}
.btn-ghost{background:transparent;border-color:transparent;color:var(--text-2)}
.btn-ghost:hover{background:var(--card-2);color:var(--text);border-color:var(--border)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{margin-bottom:16px}
.field label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px;font-weight:600;letter-spacing:.1px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;background:var(--card);border:1px solid var(--border-2);border-radius:var(--radius-sm);color:var(--text);font-size:13.5px;font-family:inherit;transition:.12s}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field .hint{font-size:11px;color:var(--text-3);margin-top:5px}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:3px;line-height:1.5}
.badge-ok{background:var(--ok-bg);color:var(--ok)}
.badge-warn{background:var(--warn-bg);color:var(--warn)}
.badge-bad{background:var(--bad-bg);color:var(--bad)}
.badge-admin{background:var(--warn-bg);color:var(--warn)}
.badge-user{background:var(--card-2);color:var(--text-2);border:1px solid var(--border-2)}

/* ===== 统计卡 ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow-sm)}
.stat .label{font-size:12px;color:var(--text-3);margin-bottom:8px;font-weight:500}
.stat .num{font-size:26px;font-weight:700;letter-spacing:-.6px;color:var(--text)}
.stat .sub{font-size:11px;color:var(--text-3);margin-top:4px}

/* ===== 表格 ===== */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:11px 14px;text-align:left;font-weight:600;color:var(--text-3);font-size:11px;letter-spacing:.3px;border-bottom:1px solid var(--border);background:var(--card-2);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--border);color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(47,91,214,.02)}
.mono{font-family:"SF Mono","JetBrains Mono","Cascadia Code",Consolas,monospace;font-size:12px;color:var(--text-2)}
.muted{color:var(--text-3)}
.thumb{width:42px;height:42px;border-radius:6px;object-fit:cover;background:var(--card-2);border:1px solid var(--border)}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pager button{min-width:34px;height:34px}
.empty{text-align:center;padding:42px 20px;color:var(--text-3);font-size:13px}

/* ===== 上传区 ===== */
.drop{border:2px dashed var(--border-2);border-radius:var(--radius);padding:46px 24px;text-align:center;cursor:pointer;transition:.18s;background:var(--card-2)}
.drop:hover{border-color:var(--accent);background:var(--accent-soft)}
.drop.drag{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{font-size:30px;margin-bottom:12px;opacity:.4}
.drop .t1{font-size:14px;color:var(--text-2);margin-bottom:4px;font-weight:500}
.drop .t2{font-size:12px;color:var(--text-3)}
.drop.disabled{opacity:.5;cursor:not-allowed}
.upload-results{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.upload-item{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 14px;box-shadow:var(--shadow-sm)}
.upload-item img{width:52px;height:52px;border-radius:6px;object-fit:cover;background:var(--card-2);flex-shrink:0}
.upload-item .meta{flex:1;min-width:0}
.upload-item .name{font-size:13px;word-break:break-all;font-weight:500}
.upload-item .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:11px;padding:4px 9px;border-radius:5px;background:var(--card-2);border:1px solid var(--border-2);color:var(--text-2);cursor:pointer;user-select:none;transition:.12s;font-weight:500}
.chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip-url{border-color:var(--accent-soft-2);color:var(--accent);background:var(--accent-soft)}
.tag-dedup{font-size:10px;padding:2px 6px;border-radius:4px;background:var(--warn-bg);color:var(--warn);margin-left:6px;font-weight:600}

/* ===== 信息行（只读展示） ===== */
.info-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--border);gap:16px}
.info-row:last-child{border-bottom:none;padding-bottom:0}
.info-row:first-child{padding-top:0}
.info-row .left{display:flex;flex-direction:column;gap:3px;min-width:0}
.info-row .label{font-size:12px;color:var(--text-3);font-weight:500}
.info-row .value{font-size:14px;color:var(--text);font-weight:500;word-break:break-all}
.info-row .value .muted{color:var(--text-3);font-weight:400}
.info-row .right{display:flex;align-items:center;gap:8px;flex-shrink:0}

/* ===== Banner ===== */
.banner{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:var(--radius-sm);margin-bottom:20px;font-size:13px;border:1px solid}
.banner-warn{background:var(--warn-bg);border-color:#e8d6a8;color:var(--warn)}

/* ===== Modal ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(26,29,35,.42);backdrop-filter:blur(3px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:80px}
.modal-overlay.show{display:flex;animation:fadeIn .18s}
.modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);width:440px;max-width:92vw;box-shadow:var(--shadow-lg);animation:slideUp .22s ease}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head .title{font-size:15px;font-weight:600;letter-spacing:-.2px}
.modal-head .close{cursor:pointer;color:var(--text-3);font-size:22px;background:none;border:none;padding:0 4px;line-height:1}
.modal-head .close:hover{color:var(--text)}
.modal-body{padding:22px}
.modal-body .field:last-child{margin-bottom:0}
.modal-foot{padding:15px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ===== Toast ===== */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:11px 20px;border-radius:var(--radius-sm);font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);opacity:0;transition:.2s;pointer-events:none;z-index:200}
.toast.show{opacity:1}
.toast.ok{background:var(--ok)}
.toast.bad{background:var(--bad)}

/* ===== Auth 页 ===== */
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.auth-card{width:380px;max-width:92vw;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.auth-head{text-align:center;padding:40px 28px 24px}
.auth-head .mark{width:52px;height:52px;border-radius:14px;background:var(--accent);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:#fff;letter-spacing:-1px}
.auth-head h1{font-size:20px;margin-bottom:4px;letter-spacing:-.3px}
.auth-head p{font-size:13px;color:var(--text-3)}
.auth-tabs{display:flex;border-bottom:1px solid var(--border)}
.auth-tab{flex:1;padding:13px;text-align:center;font-size:13.5px;color:var(--text-3);cursor:pointer;border-bottom:2px solid transparent;transition:.12s;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit;font-weight:500}
.auth-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.auth-body{padding:26px 28px 30px}
.auth-body .field:last-of-type{margin-bottom:18px}
.auth-msg{color:var(--bad);font-size:12px;min-height:16px;margin-bottom:8px}
.turnstile-wrap{margin:4px 0 14px;min-height:65px}

/* ===== 响应式 ===== */
@media(max-width:860px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .main{margin-left:0}
  .content{padding:20px 18px}
  .menu-toggle{display:block!important}
}
.menu-toggle{display:none;background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;margin-right:12px;padding:4px}
.hidden{display:none!important}
</style>
</head>
<body>

<!-- ===== Auth 页 ===== -->
<div class="auth-wrap" id="authView">
  <div class="auth-card">
    <div class="auth-head">
      <div class="mark">饼</div>
      <h1>烧饼图床</h1>
      <p>自托管 · Cloudflare R2</p>
    </div>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tabLogin">登录</button>
      <button class="auth-tab" id="tabRegister">注册</button>
    </div>
    <div class="auth-body">
      <div id="loginBox">
        <div class="field"><label>用户名</label><input id="loginUser" type="text" autocomplete="username" /></div>
        <div class="field"><label>密码</label><input id="loginPass" type="password" autocomplete="current-password" /></div>
        <div class="auth-msg" id="loginMsg"></div>
        <button class="btn btn-primary" id="btnLogin" style="width:100%;padding:10px">登录</button>
      </div>
      <div id="registerBox" class="hidden">
        <div class="field"><label>用户名</label><input id="regUser" type="text" placeholder="3-32 位字母数字下划线" /></div>
        <div class="field"><label>邮箱</label><input id="regEmail" type="email" placeholder="用于验证激活" /></div>
        <div class="field"><label>密码</label><input id="regPass" type="password" placeholder="至少 8 位" /></div>
        <div class="turnstile-wrap" id="turnstileWrap"></div>
        <div class="auth-msg" id="regMsg"></div>
        <button class="btn btn-primary" id="btnRegister" style="width:100%;padding:10px">注册</button>
        <p style="font-size:11px;color:var(--text-3);margin-top:14px;text-align:center">注册后需点击邮件链接激活邮箱才能上传</p>
      </div>
    </div>
  </div>
</div>

<!-- ===== 主应用 ===== -->
<div class="app hidden" id="appView">
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="mark">饼</div>
      <div class="txt">烧饼图床<span>SBIMG</span></div>
    </div>
    <nav class="nav" id="navList"></nav>
    <div class="foot">v1.0 · R2 Storage</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center">
        <button class="menu-toggle" id="menuToggle">☰</button>
        <div class="crumb" id="crumb">仪表盘</div>
      </div>
      <div class="user-chip" id="userChip">
        <div class="info"><span class="name" id="chipName"></span><span class="role" id="chipRole"></span></div>
        <div class="avatar" id="chipAvatar"></div>
      </div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- ===== Modal ===== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalBox">
    <div class="modal-head"><span class="title" id="modalTitle"></span><button class="close" id="modalClose">×</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let me = null, turnstileToken = null, tsWidgetId = null, turnstileEnabled = false;
let page = 1, pageSize = 30, total = 0;
let adminPage = 1, adminTotal = 0, adminFilter = 'all';
let curView = 'dashboard';

/* ===== 工具 ===== */
function toast(msg, type){ const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (type?' '+type:''); setTimeout(()=>t.className='toast', 2000); }
async function copy(text){ try { await navigator.clipboard.writeText(text); toast('已复制','ok'); } catch { toast('复制失败','bad'); } }
function escapeHtml(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(n){ if(n<1024)return n+' B'; if(n<1048576)return (n/1024).toFixed(1)+' KB'; return (n/1048576).toFixed(2)+' MB'; }
function fmtDate(d){ return new Date(d).toLocaleString('zh-CN',{hour12:false}); }
function maskToken(t){ if(!t||t.length<16) return t||'-'; return t.slice(0,8)+'••••••••'+t.slice(-4); }
function maskEmail(e){ if(!e) return '-'; const at=e.indexOf('@'); if(at<0) return e; const u=e.slice(0,at), d=e.slice(at); return (u.length>3?u.slice(0,3)+'•••':u)+d; }
async function api(path, opts){ const r = await fetch(path, opts); const t = await r.text(); let j; try{j=JSON.parse(t)}catch{j={raw:t}} if(!r.ok) throw new Error(j.error||j.raw||'HTTP '+r.status); return j; }

/* ===== Modal ===== */
function openModal(title, bodyHtml, footHtml){
  $('#modalTitle').textContent = title;
  $('#modalBody').innerHTML = bodyHtml;
  $('#modalFoot').innerHTML = footHtml;
  $('#modalOverlay').classList.add('show');
}
function closeModal(){ $('#modalOverlay').classList.remove('show'); }
$('#modalClose').addEventListener('click', closeModal);
$('#modalOverlay').addEventListener('click', e => { if(e.target===$('#modalOverlay')) closeModal(); });
function confirmBox(title, msg, onOk, danger){
  openModal(title, `<p style="font-size:13.5px;color:var(--text-2);line-height:1.6">${msg}</p>`,
    `<button class="btn btn-ghost" data-act="cancel">取消</button><button class="btn ${danger?'btn-danger':'btn-primary'}" data-act="ok">${danger?'确认删除':'确认'}</button>`);
  $('#modalFoot [data-act=cancel]').addEventListener('click', closeModal);
  $('#modalFoot [data-act=ok]').addEventListener('click', () => { closeModal(); onOk(); });
}

/* ===== 鉴权 ===== */
async function loadMe(){ try{ me = await api('/api/auth/me'); return true; }catch{ return false; } }
async function logout(){ await api('/api/auth/logout',{method:'POST'}); me=null; $('#appView').classList.add('hidden'); $('#authView').classList.remove('hidden'); }

$('#tabLogin').addEventListener('click', () => switchAuthTab('login'));
$('#tabRegister').addEventListener('click', () => switchAuthTab('register'));
function switchAuthTab(t){
  $('#tabLogin').classList.toggle('active', t==='login');
  $('#tabRegister').classList.toggle('active', t==='register');
  $('#loginBox').classList.toggle('hidden', t!=='login');
  $('#registerBox').classList.toggle('hidden', t!=='register');
  $('#loginMsg').textContent=''; $('#regMsg').textContent='';
  if(t==='register') setupTurnstile();
}
$('#btnLogin').addEventListener('click', async () => {
  try{ me = await api('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#loginUser').value.trim(),password:$('#loginPass').value})}); enterApp(); }
  catch(e){ $('#loginMsg').textContent = e.message; }
});
$('#btnRegister').addEventListener('click', async () => {
  try{
    me = await api('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#regUser').value.trim(),email:$('#regEmail').value.trim(),password:$('#regPass').value,turnstileToken})});
    if(me.verification_sent) toast('注册成功，请查收邮件激活','ok');
    enterApp();
  }catch(e){ $('#regMsg').textContent = e.message; if(tsWidgetId!==null && window.turnstile) window.turnstile.reset(tsWidgetId); }
});

/* ===== Turnstile ===== */
async function setupTurnstile(){
  if(tsWidgetId!==null) return;
  try{
    const k = await api('/api/auth/turnstile-key');
    turnstileEnabled = k.enabled;

/* ===== 导航（按角色动态生成） ===== */
function navItems(){
  const items = [
    {id:'dashboard',label:'仪表盘',ico:'⊞'},
    {id:'upload',label:'上传图片',ico:'⬆'},
    {id:'images',label:'我的图片',ico:'▦'},
    {id:'account',label:'账户',ico:'⚙'},
  ];
  if(me && me.role==='admin') items.push({id:'admin',label:'管理后台',ico:'★'});
  return items;
}
function buildNav(){
  const nav = $('#navList'); nav.innerHTML='';
  const items = navItems();
  items.forEach(n => {
    const b = document.createElement('button');
    b.className='nav-item'+(n.id===curView?' active':'');
    b.innerHTML = `<span class="ico">${n.ico}</span>${n.label}`;
    b.addEventListener('click', () => navTo(n.id));
    nav.appendChild(b);
  });
}
function navTo(view){
  curView = view;
  buildNav();
  $('#sidebar').classList.remove('open');
  const labels = {dashboard:'仪表盘',upload:'上传图片',images:'我的图片',account:'账户',admin:'管理后台'};
  $('#crumb').textContent = labels[view] || '';

}
$('#menuToggle').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
$('#userChip').addEventListener('click', () => navTo('account'));

/* ===== 上传 ===== */
function renderUpload(c){
  const canUpload = me.email_verified;
  c.innerHTML = `
    ${!canUpload ? '<div class="banner banner-warn">⚠️ 邮箱未验证，上传已禁用。<button class="btn btn-sm" id="upResend" style="margin-left:auto">重发验证邮件</button></div>' : ''}
    <div class="card">
      <div class="card-title">上传图片</div>
      <div class="drop ${canUpload?'':'disabled'}" id="drop">
        <div class="big">⬆</div>
        <div class="t1">${canUpload?'拖拽图片到此处 / 点击选择 / Ctrl+V 粘贴':'邮箱未验证，上传已禁用'}</div>
        <div class="t2">支持 jpg / png / gif / webp / bmp</div>
        <input id="fileInput" type="file" accept="image/*" multiple hidden>
      </div>
      <div class="upload-results" id="results"></div>
    </div>`;
  if(!canUpload){ $('#upResend').addEventListener('click', async () => { try{ await api('/api/auth/resend-verification',{method:'POST'}); toast('验证邮件已重发','ok'); }catch(e){ toast(e.message,'bad'); } }); return; }
  const drop = $('#drop'), fileInput = $('#fileInput');
  drop.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', () => { if(fileInput.files.length) uploadFiles(fileInput.files); fileInput.value=''; });
  ['dragenter','dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('drag'); }));
  ['dragleave','drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('drag'); }));
  drop.addEventListener('drop', ev => { if(ev.dataTransfer.files.length) uploadFiles(ev.dataTransfer.files); });
  window.addEventListener('paste', onPaste);
}
function onPaste(ev){ if(curView!=='upload' || !me || !me.email_verified) return; const fs=[]; for(const it of ev.clipboardData.items){ if(it.kind==='file'){ const f=it.getAsFile(); if(f) fs.push(f); } } if(fs.length) uploadFiles(fs); }
function uploadFiles(files){ if(!me||!me.email_verified){ toast('请先验证邮箱','bad'); return; } Array.from(files).forEach(uploadOne); }
function uploadOne(file){
  const fd = new FormData(); fd.append('file', file);
  const card = document.createElement('div'); card.className='upload-item';
  card.innerHTML = `<img><div class="meta"><div class="name">上传中: ${escapeHtml(file.name)}</div><div class="links"><span class="chip">…</span></div></div>`;
  $('#results').prepend(card);
  card.querySelector('img').src = URL.createObjectURL(file);
  fetch('/upload',{method:'POST',headers:{'Authorization':'Bearer '+me.api_token},body:fd})
    .then(async r => { const text = await r.text(); if(!r.ok) throw new Error(text); return text; })
    .then(text => { let url, j; try{j=JSON.parse(text);url=j.url;}catch{url=text;j={url};}
      card.querySelector('.name').innerHTML = escapeHtml(file.name) + (j.duplicated?'<span class="tag-dedup">去重</span>':'');
      const box = card.querySelector('.links'); box.innerHTML='';
      [['URL',j.url],['MD',j.markdown],['HTML',j.html],['BB',j.bbcode]].filter(([,v])=>v).forEach(([l,v])=>{ const c=document.createElement('span'); c.className='chip'+(l==='URL'?' chip-url':''); c.textContent=l; c.addEventListener('click',()=>copy(v)); box.appendChild(c); });
    })
    .catch(err => { card.querySelector('.name').textContent = '失败: '+(err.message||'未知错误'); card.style.opacity=.5; });
}

/* ===== 我的图片 ===== */
async function renderImages(c){
  c.innerHTML = `<div class="card"><div class="card-title">我的图片<span class="sub" id="imgCount"></span></div>
    <div class="tbl-wrap"><table><thead><tr><th>预览</th><th>文件名 / Key</th><th>大小</th><th>尺寸</th><th>时间</th><th>操作</th></tr></thead><tbody id="tbody"><tr><td colspan="6" class="empty">加载中…</td></tr></tbody></table></div>
    <div class="pager" id="pager"></div></div>`;
  await loadImages();
}
async function loadImages(){
  try{
    const data = await api(`/api/images?page=${page}&size=${pageSize}`);
    total = data.total;
    $('#imgCount').textContent = `共 ${total} 张`;
    const tb = $('#tbody');
    if(!data.items.length){ tb.innerHTML = '<tr><td colspan="6" class="empty">暂无图片</td></tr>'; renderPager(); return; }
    tb.innerHTML = data.items.map(it => `<tr>
      <td><img class="thumb" src="${it.url}" loading="lazy"></td>
      <td><span class="mono">${escapeHtml(it.original_name||it.key)}</span><br><span class="muted" style="font-size:11px">${escapeHtml(it.key)}</span></td>
      <td>${fmtSize(it.size)}</td>
      <td class="muted">${it.width&&it.height?it.width+'×'+it.height:'-'}</td>
      <td class="muted">${fmtDate(it.created_at)}</td>
      <td><button class="btn btn-sm btn-danger" data-del="${it.id}">删除</button></td></tr>`).join('');
    tb.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
      confirmBox('删除图片','确认删除该图片？将同时删除 R2 中的对象，不可恢复。', async () => {
        try{ await api(`/api/images/${b.dataset.del}`,{method:'DELETE'}); toast('已删除','ok'); loadImages(); }catch(e){ toast(e.message,'bad'); }
      }, true);
    }));
    renderPager();
  }catch(e){ $('#tbody').innerHTML = `<tr><td colspan="6" class="empty">${escapeHtml(e.message)}</td></tr>`; }
}
function renderPager(){
  const pages = Math.max(1, Math.ceil(total/pageSize)); const box = $('#pager'); box.innerHTML='';
  if(pages<=1) return;
  const mk=(l,p,d)=>{ const b=document.createElement('button'); b.className='btn'; b.textContent=l; b.disabled=!!d; b.addEventListener('click',()=>{page=p;loadImages();}); return b; };
  box.appendChild(mk('‹',page-1,page<=1));
  const sp=document.createElement('span'); sp.style.cssText='font-size:13px;color:var(--text-2)'; sp.textContent=`${page} / ${pages}`; box.appendChild(sp);
  box.appendChild(mk('›',page+1,page>=pages));
}

     <div class="field"><label>密码</label><input id="nuPass" type="password" placeholder="至少 8 位" /></div>
     <div class="field"><label>角色</label><select id="nuRole"><option value="user">普通用户</option><option value="admin">管理员</option></select></div>`,
    `<button class="btn btn-ghost" data-act="cancel">取消</button><button class="btn btn-primary" data-act="save">创建</button>`);
  $('#modalFoot [data-act=cancel]').addEventListener('click', closeModal);
  $('#modalFoot [data-act=save]').addEventListener('click', async () => {
    try{ await api('/api/admin/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#nuUser').value.trim(),email:$('#nuEmail').value.trim()||undefined,password:$('#nuPass').value,role:$('#nuRole').value})}); closeModal(); toast('已创建','ok'); loadUsers(); loadAdminStats(); }
    catch(e){ toast(e.message,'bad'); }
  });
}
async function loadAdminImages(){
  let q = `page=${adminPage}&size=30&all=1`;
  if(adminFilter==='mine') q = `page=${adminPage}&size=30`;
  else if(adminFilter==='unowned') q = `page=${adminPage}&size=30&all=1&user_id=null`;
  try{
    const data = await api(`/api/images?${q}`);
    adminTotal = data.total;
    const tb = $('#adminTbody');
    if(!data.items.length){ tb.innerHTML = '<tr><td colspan="6" class="empty">暂无图片</td></tr>'; }
    else{
      tb.innerHTML = data.items.map(it => `<tr>
        <td><img class="thumb" src="${it.url}" loading="lazy"></td>
        <td><span class="mono">${escapeHtml(it.key)}</span></td>
        <td class="muted">${it.user_id==null?'无主':'#'+it.user_id}</td>
        <td>${fmtSize(it.size)}</td>
        <td class="muted">${fmtDate(it.created_at)}</td>
        <td><button class="btn btn-sm btn-danger" data-del="${it.id}">删除</button></td></tr>`).join('');
      tb.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => confirmBox('删除图片','确认删除该图片？将同时删除 R2 中的对象。', async () => { try{ await api(`/api/images/${b.dataset.del}`,{method:'DELETE'}); toast('已删除','ok'); loadAdminImages(); loadAdminStats(); }catch(e){ toast(e.message,'bad'); } }, true)));
    }
    const pages = Math.max(1, Math.ceil(adminTotal/30)); const box = $('#adminPager'); box.innerHTML='';
    if(pages<=1) return;
    const mk=(l,p,d)=>{ const b=document.createElement('button'); b.className='btn'; b.textContent=l; b.disabled=!!d; b.addEventListener('click',()=>{adminPage=p;loadAdminImages();}); return b; };
    box.appendChild(mk('‹',adminPage-1,adminPage<=1));
    const sp=document.createElement('span'); sp.style.cssText='font-size:13px;color:var(--text-2)'; sp.textContent=`${adminPage} / ${pages}`; box.appendChild(sp);
    box.appendChild(mk('›',adminPage+1,adminPage>=pages));
  }catch(e){ $('#adminTbody').innerHTML = `<tr><td colspan="6" class="empty">${escapeHtml(e.message)}</td></tr>`; }
}

/* ===== 启动 ===== */
(async () => { if(await loadMe()) enterApp(); else { $('#authView').classList.remove('hidden'); $('#appView').classList.add('hidden'); } })();
</script>
